services:
  # Ollama for local AI development
  ollama:
    image: ollama/ollama:latest
    container_name: securechat-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    # GPU reservation is opt-in: create docker-compose.override.yml with the
    # nvidia device block if your host has CUDA support.

  # PostgreSQL (optional — production uses Neon; set SECURECHAT_DATABASE_URL
  # in server/.env to point at Neon instead of this container).
  # Migrations are NOT run here: the server runs goose on startup.
  postgres:
    image: postgres:16
    container_name: securechat-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securechat}
      POSTGRES_USER: ${POSTGRES_USER:-securechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  postgres_data:

networks:
  default:
    name: securechat-network
