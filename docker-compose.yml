services:
  # Ollama for local AI development
  ollama:
    image: ollama/ollama:latest
    container_name: securechat-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    # GPU reservation is opt-in: create docker-compose.override.yml with the
    # nvidia device block if your host has CUDA support.

  # MySQL (optional - if not installing locally)
  mysql:
    image: mysql:8.0
    container_name: securechat-mysql
    ports:
      - "3306:3306"
    environment:
      # Credentials are supplied via .env next to this file (MYSQL_ROOT_PASSWORD etc.)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-securechat}
      MYSQL_USER: ${MYSQL_USER:-securechat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/migrations:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  mysql_data:

networks:
  default:
    name: securechat-network
