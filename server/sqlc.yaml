version: "2"
sql:
  - engine: "mysql"
    schema: "migrations/"
    queries: "internal/database/queries/"
    gen:
      go:
        package: "database"
        out: "internal/database/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - db_type: "tinyint(1)"
            go_type: "bool"
          - db_type: "decimal"
            go_type: "float64"