[versions]
# Android & Kotlin
agp = "8.13.2"
kotlin = "2.0.21"
compileSdk = "34"
minSdk = "24"
targetSdk = "34"
coreKtx = "1.13.1"
lifecycle = "2.7.0"
activity = "1.9.0"
material = "1.12.0"

# Compose
composeBom = "2024.08.00"
material3 = "1.3.0"
navigation = "2.7.7"

# Hilt
hilt = "2.52"

# Room
room = "2.6.1"

# Ktor
ktor = "3.0.1"

# Serialization
serialization = "1.6.3"

# Coroutines
coroutines = "1.8.0"

# Coil
coil = "2.6.0"

# OkHttp
okhttp = "4.12.0"

# WorkManager
workmanager = "2.9.0"

# Security
securityCrypto = "1.1.0-alpha06"
biometric = "1.2.0-alpha04"

# Testing
junit = "4.13.2"
junitJupiter = "5.10.2"
mockk = "1.13.14"
turbine = "1.0.0"
robolectric = "4.11.1"
espresso = "3.5.1"
truth = "1.1.3"

# Firebase
googleServices = "4.4.2"
firebaseBom = "33.6.0"

# Credential Manager (Google Sign-In)
credentials = "1.2.2"
googleid = "1.1.0"

[libraries]
# Android & Kotlin
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
